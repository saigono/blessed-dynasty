[package]
name = "ui"
version.workspace = true
edition.workspace = true

[dependencies]
core = { path = "../core" }
# glow: wgpu finds no adapter on GL-only machines, and the wasm is smaller.
# Stage 29: the sprites of the old map and data/sprites.ron.
png = "0.18"
# Stage 29b: the event pictures, assets/sprites/events/*.jpg; already in the lock through eframe.
zune-jpeg = "0.5"
ron = "0.12"
serde = { version = "1", features = ["derive"] }
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
# Stage 11b: fetch for the game statistics; already in the lock through eframe.
web-sys = { version = "0.3", features = ["RequestInit", "Window"] }

[dev-dependencies]
# Stage 11b: the tests read the statistics body; already in the lock through cli.
serde_json = "1"
