<title>Редактор Blessed Dynasty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a scribe's desk. A strip with the realm's actions on top, the data tree as the
   ledger on the left, the open record (or map, runs, edits) on the right. Heraldic tinctures:
   azure for the crown and actions, or for edits, gules for errors. */
:root {
  --bg: #eceff2;
  --panel: #fbfcfd;
  --sunk: #e3e7ec;
  --ink: #1b222b;
  --muted: #5b6672;
  --line: #d2d8df;
  --accent: #26598c;
  --accent-ink: #ffffff;
  --or: #8a6209;
  --or-soft: #f5ead0;
  --bad: #b02a22;
  --bad-soft: #f8e1df;
  --ok: #2b7547;
  --ok-soft: #dff0e5;
  --m-crown: #3a6ea5;
  --m1: #c08a2c;
  --m2: #8c5aa8;
  --m3: #3f8f6e;
  --m4: #b5523c;
  --m5: #7a8a3a;
  --m6: #5d7f96;
  --m7: #9a6b4f;
  --m8: #4f8a9a;
  --m9: #a0577a;
  --font-display: "Cormorant SC", "Palatino Linotype", Georgia, serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161b; --panel: #191e25; --sunk: #222831; --ink: #e2e6eb; --muted: #95a0ac;
    --line: #2d343d; --accent: #7eaee0; --accent-ink: #0d1520; --or: #e0b44c; --or-soft: #3a3020;
    --bad: #f07d73; --bad-soft: #3d2222; --ok: #6cc58f; --ok-soft: #1e3427; --m-crown: #5f93cc;
    --m1: #c9a052; --m2: #a77fc0; --m3: #5fae8c; --m4: #cf7a63; --m5: #9caf5a; --m6: #7ea0b8; --m7: #bf8f72; --m8: #72aebf; --m9: #c27a9c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161b; --panel: #191e25; --sunk: #222831; --ink: #e2e6eb; --muted: #95a0ac;
  --line: #2d343d; --accent: #7eaee0; --accent-ink: #0d1520; --or: #e0b44c; --or-soft: #3a3020;
  --bad: #f07d73; --bad-soft: #3d2222; --ok: #6cc58f; --ok-soft: #1e3427; --m-crown: #5f93cc;
  --m1: #c9a052; --m2: #a77fc0; --m3: #5fae8c; --m4: #cf7a63; --m5: #9caf5a; --m6: #7ea0b8; --m7: #bf8f72; --m8: #72aebf; --m9: #c27a9c;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font-body); display: flex; flex-direction: column; }
button, input, select, textarea { font: inherit; color: inherit; }
.mono, code, pre, .num { font-family: var(--font-mono); font-size: 12.5px; }
.muted { color: var(--muted); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.top {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px;
  padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
}
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-right: auto; }
.brand h1 { margin: 0; font: 700 23px/1.1 var(--font-display); letter-spacing: .02em; }
.store { display: flex; align-items: center; gap: 8px; font-size: 13px; max-width: 48ch; }
.store .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.store[data-state="db"] .dot { background: var(--ok); }
.store[data-state="memory"] .dot, .store[data-state="readonly"] .dot { background: var(--or); }
.store[data-state="memory"], .store[data-state="readonly"] { color: var(--or); }
.actions { display: flex; align-items: center; gap: 8px; }
button {
  border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius);
  padding: 5px 11px; cursor: pointer;
}
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.quiet { border-color: transparent; background: none; color: var(--muted); padding: 3px 6px; }
button.quiet:hover { color: var(--ink); }
button:disabled { opacity: .55; cursor: default; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 99px; font-size: 12px; background: var(--sunk); white-space: nowrap; }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.or { background: var(--or-soft); color: var(--or); }

.app { display: grid; grid-template-columns: minmax(250px, 320px) minmax(0, 1fr); flex: 1; min-height: 0; }
.top { flex: none; }
.side { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
.side .search { padding: 10px 12px 8px; border-bottom: 1px solid var(--line); }
.side input[type="search"] { width: 100%; box-sizing: border-box; padding: 6px 9px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); }
.tree, .results { overflow: auto; padding: 6px 4px 24px; flex: 1; min-height: 0; }
.tree details > :not(summary) { margin-left: 13px; border-left: 1px solid var(--line); padding-left: 3px; }
.tree summary { list-style: none; display: flex; align-items: center; cursor: pointer; }
.tree summary::-webkit-details-marker { display: none; }
.tree summary::before { content: "▸"; width: 13px; flex: none; color: var(--muted); font-size: 11px; text-align: center; }
.tree details[open] > summary::before { content: "▾"; }
.tleaf { padding-left: 13px; }
.tlabel { display: flex; align-items: baseline; gap: 6px; width: 100%; text-align: left; border: 0; background: none; padding: 2px 6px; border-radius: 4px; min-width: 0; }
.tlabel:hover { background: var(--sunk); }
.tlabel .tl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 0 1 auto; min-width: 0; }
.tlabel .ts { color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 0; min-width: 0; }
.tlabel.sel { background: var(--accent); color: var(--accent-ink); }
.tlabel.sel .ts { color: inherit; opacity: .8; }
.tlabel.edited .tl::after { content: " •"; color: var(--or); font-weight: 700; }
.tlabel.sel.edited .tl::after { color: inherit; }
.tlabel.bad .tl { color: var(--bad); }
.tlabel.sel.bad .tl { color: inherit; }
.tlabel.lint .tl { text-decoration: underline wavy var(--or); text-underline-offset: 3px; }
.tgroup { font: 600 11px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 12px 8px 4px; }
.results button { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: none; padding: 7px 8px; }
.results button:hover { background: var(--sunk); }
.results .snip { display: block; color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.results mark { background: var(--or-soft); color: inherit; }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.tabs { display: flex; gap: 2px; padding: 8px 16px 0; border-bottom: 1px solid var(--line); overflow-x: auto; flex: none; }
.tabs button { border: 1px solid transparent; border-bottom: 0; border-radius: var(--radius) var(--radius) 0 0; background: none; padding: 7px 14px; color: var(--muted); white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--panel); border-color: var(--line); color: var(--ink); margin-bottom: -1px; font-weight: 500; }
.tab { overflow: auto; padding: 16px; flex: 1; min-height: 0; }
.tab h2 { font: 700 21px/1.2 var(--font-display); margin: 0; letter-spacing: .02em; text-wrap: balance; }
.tab h3 { font: 600 12px/1.2 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
.note { color: var(--muted); max-width: 70ch; margin: 6px 0; }
.empty { max-width: 56ch; padding: 24px 0; color: var(--muted); }

.rec-head { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px 16px; margin-bottom: 12px; }
.rec-head .crumbs { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.rec-head .tools { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.seg button { border: 0; border-radius: 0; }
.seg button[aria-pressed="true"] { background: var(--sunk); font-weight: 600; }
.form { display: grid; gap: 6px; max-width: 980px; }
.row { display: grid; grid-template-columns: minmax(110px, 180px) minmax(0, 1fr); gap: 4px 12px; align-items: start; }
.row > label { padding-top: 5px; font-size: 13px; overflow-wrap: anywhere; }
.row > label .k { display: block; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.row.wide { grid-template-columns: minmax(0, 1fr); }
.row > [size], .row > input[type="checkbox"] { justify-self: start; }
.row.wide > label { padding-top: 6px; }
.box { border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; background: var(--panel); display: grid; gap: 6px; min-width: 0; }
.box.flat { background: none; }
.bhead { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: start; }
.inline { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
.vname { font-family: var(--font-mono); font-size: 12px; color: var(--accent); }
input[type="text"], input:not([type]), textarea, select, input[type="number"] {
  border: 1px solid var(--line); border-radius: 4px; background: var(--panel); padding: 4px 7px; min-width: 0; max-width: 100%;
}
.form input:not([type]):not([size]) { width: 100%; box-sizing: border-box; }
textarea { width: 100%; box-sizing: border-box; resize: vertical; line-height: 1.5; }
textarea.ron { font-family: var(--font-mono); font-size: 12.5px; min-height: 360px; white-space: pre; tab-size: 4; }
.num { text-align: right; }
.bad-field { border-color: var(--bad) !important; box-shadow: 0 0 0 1px var(--bad); }
.issue { font-size: 12.5px; color: var(--bad); background: var(--bad-soft); border-radius: 4px; padding: 3px 8px; overflow-wrap: anywhere; white-space: pre-wrap; }
.issue.lint { color: var(--or); background: var(--or-soft); }
.cases { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px 8px; min-width: 0; }
.cases label { display: grid; font-size: 11px; color: var(--muted); }
.cases input { font-size: 13.5px; color: var(--ink); }
.panel-cases { margin-top: 14px; max-width: 980px; }

.mapwrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(180px, 240px); gap: 16px; align-items: start; }
.mapwrap svg { width: 100%; height: auto; background: var(--sunk); border-radius: var(--radius); display: block; }
.mapwrap polygon { stroke: var(--panel); stroke-width: 1.2; cursor: pointer; fill-opacity: .82; transition: fill-opacity .12s; }
.mapwrap polygon:hover, .mapwrap polygon:focus-visible { fill-opacity: 1; outline: none; }
.mapwrap polygon.sel { stroke: var(--ink); stroke-width: 2; }
.mapwrap text { pointer-events: none; fill: var(--ink); font-family: var(--font-body); }
.legend { display: grid; gap: 6px; font-size: 13px; }
.legend label { display: grid; gap: 4px; }
.legend span.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; }

.runform { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; }
.runform label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
.runform input[type="number"] { width: 9ch; }
.runform .check { display: flex; align-items: center; gap: 6px; color: var(--ink); font-size: 13px; }
.progress { display: flex; align-items: center; gap: 10px; margin: 12px 0; flex-wrap: wrap; }
.progress .bar { flex: 1 1 200px; max-width: 420px; height: 8px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.progress .bar > i { display: block; height: 100%; width: 0; background: var(--accent); }
.tablewrap { overflow-x: auto; max-width: 100%; }
table { border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 4px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: 12px; }
td.n { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--font-mono); font-size: 12.5px; white-space: nowrap; }
td.up { color: var(--ok); } td.down { color: var(--bad); }
tr.zero td:first-child { color: var(--bad); }
pre.out { background: var(--sunk); border-radius: var(--radius); padding: 10px 12px; overflow: auto; max-height: 460px; white-space: pre-wrap; }
details.more > summary { cursor: pointer; color: var(--accent); margin: 10px 0 6px; }
.issues { display: grid; gap: 4px; max-width: 980px; }
.issues button { text-align: left; border: 0; border-radius: 4px; background: none; padding: 4px 8px; display: grid; grid-template-columns: minmax(90px, auto) minmax(0, 1fr); gap: 8px; }
.issues button:hover { background: var(--sunk); }
.issues .where { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }

@media (max-width: 760px) {
  body { display: block; height: auto; }
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { border-right: 0; border-bottom: 1px solid var(--line); max-height: 42vh; }
  .row { grid-template-columns: minmax(0, 1fr); }
  .row > label { padding-top: 0; }
  .mapwrap { grid-template-columns: minmax(0, 1fr); }
  .cases { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tab { overflow: visible; }
  .issues button { grid-template-columns: minmax(0, 1fr); }
}
</style>

<header class="top">
  <div class="brand">
    <h1>Редактор Blessed Dynasty</h1>
    <span id="base" class="muted mono"></span>
  </div>
  <div class="store" id="store" data-state="connecting"><span class="dot"></span><span id="store-text">Подключаюсь к базе артефакта…</span></div>
  <div class="actions">
    <button id="btn-check" class="primary" type="button">Проверить</button>
    <span id="check-sum" class="chip">не проверено</span>
  </div>
</header>
<div class="app">
  <aside class="side">
    <div class="search"><input id="search" type="search" placeholder="Поиск по id и тексту" autocomplete="off" aria-label="Поиск по id и тексту"></div>
    <nav id="tree" class="tree" aria-label="Данные"></nav>
    <div id="results" class="results" hidden></div>
  </aside>
  <main class="main">
    <nav class="tabs" role="tablist">
      <button type="button" data-tab="record" aria-selected="true">Запись</button>
      <button type="button" data-tab="map" aria-selected="false">Карта</button>
      <button type="button" data-tab="run" aria-selected="false">Прогон</button>
      <button type="button" data-tab="edits" aria-selected="false">Правки <span id="edits-n" class="chip">0</span></button>
      <button type="button" data-tab="check" aria-selected="false">Проверка</button>
    </nav>
    <section id="tab-record" class="tab"><p class="empty">Загружаю данные игры…</p></section>
    <section id="tab-map" class="tab" hidden></section>
    <section id="tab-run" class="tab" hidden></section>
    <section id="tab-edits" class="tab" hidden></section>
    <section id="tab-check" class="tab" hidden></section>
  </main>
</div>

<script>
'use strict';
// ---------------------------------------------------------------- helpers
const $ = (s, el = document) => el.querySelector(s);
const PROPS = new Set(['value', 'checked', 'open', 'disabled', 'hidden', 'selected', 'title']);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else if (PROPS.has(k)) el[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat(9)) if (k != null && k !== false) el.append(k instanceof Node ? k : String(k));
  return el;
}
const fnv = s => { let x = 0x811c9dc5; for (const c of s) x = Math.imul(x ^ c.codePointAt(0), 0x01000193) >>> 0; return x.toString(36); };
const pct = (n, of) => of ? Math.round(n * 100 / of) : 0;
const SEP = '\u0001';

// ---------------------------------------------------------------- RON
// A node: {k: str|num|ident|list|map|tuple|struct, s, e (offsets), v | items | entries | fields, name}.
function parseRon(text) {
  let i = 0;
  const fail = m => { const e = new Error(m); e.pos = i; throw e; };
  const IDENT = /[A-Za-z_][A-Za-z0-9_]*/y, NUM = /[-+]?(\d[\d_]*)?(\.\d+)?([eE][-+]?\d+)?/y;
  const mk = (k, s, o) => Object.assign({ k, s, e: i }, o);
  function ws() {
    for (;;) {
      const c = text[i];
      if (c === ' ' || c === '\n' || c === '\t' || c === '\r') i++;
      else if (c === '/' && text[i + 1] === '/') { const j = text.indexOf('\n', i); i = j < 0 ? text.length : j; }
      else if (c === '/' && text[i + 1] === '*') { const j = text.indexOf('*/', i + 2); if (j < 0) fail('незакрытый комментарий'); i = j + 2; }
      else return;
    }
  }
  function str() {
    i++;
    let v = '';
    for (;;) {
      const c = text[i++];
      if (c === undefined) fail('незакрытая строка');
      if (c === '"') return v;
      if (c !== '\\') { v += c; continue; }
      const d = text[i++];
      if (d === 'n') v += '\n'; else if (d === 't') v += '\t'; else if (d === 'r') v += '\r';
      else if (d === 'u') {
        const m = /^\{([0-9a-fA-F]+)\}/.exec(text.slice(i, i + 10));
        if (!m) fail('плохой \\u');
        v += String.fromCodePoint(parseInt(m[1], 16)); i += m[0].length;
      } else v += d;
    }
  }
  function seq(close) {
    const items = [];
    for (;;) {
      ws();
      if (text[i] === close) { i++; return items; }
      items.push(value()); ws();
      if (text[i] === ',') i++; else if (text[i] !== close) fail(`ожидалось «,» или «${close}»`);
    }
  }
  function group(name, s) {
    i++; ws();
    IDENT.lastIndex = i;
    const m = IDENT.exec(text);
    let struct = false;
    if (m) { const back = i; i += m[0].length; ws(); struct = text[i] === ':'; i = back; }
    if (!struct) { const items = seq(')'); return mk('tuple', s, { name, items }); }
    const fields = [];
    for (;;) {
      ws();
      if (text[i] === ')') { i++; break; }
      IDENT.lastIndex = i;
      const f = IDENT.exec(text);
      if (!f) fail('ожидалось имя поля');
      i += f[0].length; ws();
      if (text[i] !== ':') fail('ожидалось «:»');
      i++;
      fields.push({ key: f[0], val: value() }); ws();
      if (text[i] === ',') i++; else if (text[i] !== ')') fail('ожидалось «,» или «)»');
    }
    return mk('struct', s, { name, fields });
  }
  function value() {
    ws();
    const s = i, c = text[i];
    if (c === '"') { const v = str(); return mk('str', s, { v }); }
    if (c === '[') { i++; const items = seq(']'); return mk('list', s, { items }); }
    if (c === '{') {
      i++;
      const entries = [];
      for (;;) {
        ws();
        if (text[i] === '}') { i++; break; }
        const key = value(); ws();
        if (text[i] !== ':') fail('ожидалось «:»');
        i++;
        entries.push({ key, val: value() }); ws();
        if (text[i] === ',') i++; else if (text[i] !== '}') fail('ожидалось «,» или «}»');
      }
      return mk('map', s, { entries });
    }
    if (c === '(') return group(null, s);
    NUM.lastIndex = i;
    let m = NUM.exec(text);
    if (m && /\d/.test(m[0])) { i += m[0].length; return mk('num', s, { v: m[0] }); }
    IDENT.lastIndex = i;
    m = IDENT.exec(text);
    if (m) {
      i += m[0].length;
      const back = i; ws();
      if (text[i] === '(') return group(m[0], s);
      i = back;
      return mk('ident', s, { v: m[0] });
    }
    fail(c === undefined ? 'неожиданный конец' : `неожиданный символ «${c}»`);
  }
  const root = value(); ws();
  if (i < text.length) fail('лишний текст после значения');
  return root;
}
const q = v => '"' + v.replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n').replace(/\t/g, '\\t') + '"';
function flat(n) {
  switch (n.k) {
    case 'str': return q(n.v);
    case 'num': case 'ident': return n.v;
    case 'list': return '[' + n.items.map(flat).join(', ') + ']';

}

// ---------------------------------------------------------------- runs
// The `#` summary of `cli batch`.
function parseSummary(text) {
  const L = text.split('\n');
  const rest = p => L.find(l => l.startsWith(p) && /^[-\d]/.test(l.slice(p.length)))?.slice(p.length);
  const q3 = p => rest(p)?.split(' / ').map(Number);
  const share = p => { const r = rest(p); return r == null ? null : parseInt(r, 10); };
  const falls = {};
  const fi = L.indexOf('# причины падения:');
  for (const l of fi < 0 ? [] : L.slice(fi + 1)) { const m = /^# {3}(\w+) (\d+)%$/.exec(l); if (!m) break; falls[m[1]] = +m[2]; }
  const nodes = {};
  const ni = L.findIndex(l => l.startsWith('# скрытые узлы'));
  for (const l of ni < 0 ? [] : L.slice(ni + 1)) {
    const m = /^# {3}(\w+) (.+) \| (.+) \| (.+) \| ([\d.]+)%$/.exec(l);
    if (!m) break;
    nodes[m[1]] = { at100: m[2].split(' / ').map(Number), at150: m[3].split(' / ').map(Number), fall: m[4].split(' / ').map(Number) };
  }
  return {
    runs: +(/^# runs (\d+)/m.exec(text)?.[1] || 0),
    score: q3('#   счёт '), score150: q3('#   счёт за 150 лет '), years: q3('#   лет династии '),
    reign: q3('#   лет правления '), army: q3('#   армия в конце '), treasury: q3('#   казна в конце '),
    early: share('# ранняя смерть '), deserted: share('# дезертирство в '), fell: share('# доля падений '),
    falls, nodes,
  };
}
// The criteria of stage 8b (docs/calibration.md, the cli test calibration_criteria_hold).
function criteria(r) {
  const n = r.neutral?.summary, c = r.crown_all?.summary, v = r.vassal_all?.summary, w = r.warmonger?.summary;
  const out = [];
  const add = (name, need, val, ok) => out.push({ name, need, val, ok: ok == null ? null : !!ok });
  add('Ранняя смерть на neutral', '≤ 10%', n ? n.early + '%' : null, n && n.early <= 10);
  add('Медиана правления на neutral', '25–40 лет', n ? n.reign[1] : null, n && n.reign[1] >= 25 && n.reign[1] <= 40);
  if (c && v && w) {
    const by = [['vassal_all', v], ['crown_all', c], ['warmonger', w]].sort((a, b) => a[1].score[1] - b[1].score[1]);
    const apart = by.slice(1).map((x, j) => Math.round((x[1].score[1] / Math.max(1, by[j][1].score[1]) - 1) * 100));
    add('Медианы счёта соседних стратегий', '≥ 15% друг от друга', by.map(x => `${x[0]} ${x[1].score[1]}`).join(' < ') + ` (+${apart.join('%, +')}%)`, apart.every(a => a >= 15));
    const differ = (a, b) => Object.keys({ ...a.falls, ...b.falls }).some(k => Math.abs((a.falls[k] || 0) - (b.falls[k] || 0)) >= 15);
    add('Причины падения соседних по счёту', '≥ 15 п.п. по одной причине', by.map(x => x[0]).join(' / '), differ(by[0][1], by[1][1]) && differ(by[1][1], by[2][1]));
  } else {
    add('Медианы счёта соседних стратегий', '≥ 15% друг от друга', null, null);
    add('Причины падения соседних по счёту', '≥ 15 п.п. по одной причине', null, null);
  }
  add('Медиана казны в конце на neutral', '≤ 2200', n ? n.treasury[1] : null, n ? n.treasury[1] <= 2200 : null);
  add('Дезертирство у warmonger', '≥ 10% династий', w ? w.deserted + '%' : null, w ? w.deserted >= 10 : null);
  const noHeir = n && w ? (w.falls.NoHeir || 0) - (n.falls.NoHeir || 0) : null;
  add('NoHeir warmonger минус neutral', '≤ 5 п.п.', noHeir == null ? null : noHeir + ' п.п.', noHeir == null ? null : noHeir <= 5);
  return out;
}

  return ['neutral', ...(st?.k === 'map' ? st.entries.map(e => keyText(e.key)) : [])];

    h('div', { class: 'runform' },
      h('label', {}, 'Стратегия', strat), h('label', {}, 'Партий, 100–1000', runs), h('label', {}, 'Seed с', seed),
      h('label', {}, 'Закон с начала', law),
      h('label', { class: 'check' }, compare, 'Сравнить с данными до правок'), go, stop),
    h('div', { class: 'progress', id: 'run-progress', hidden: true }, h('div', { class: 'bar' }, h('i', { id: 'run-bar' })), h('span', { id: 'run-count', class: 'mono' })),
    h('div', { id: 'run-out' }),
    h('h3', {}, 'Одна партия на правленых данных'),
    h('div', { class: 'runform' }, h('label', {}, 'Seed', tSeed),
      h('button', { type: 'button', onclick: () => one('chronicle') }, 'Летопись'),
      h('label', {}, 'Трассировка', tNode),

async function runBatch() {
  const strat = $('#run-strategy').value, runs = Math.max(100, Math.min(1000, Math.round(+$('#run-runs').value) || 100));
  const seed = Math.max(0, Math.round(+$('#run-seed').value) || 0), law = $('#run-law').value, compare = $('#run-compare').checked;
  $('#run-runs').value = runs;
  const strategies = strat === '*' ? strategiesList() : [strat];
  const plan = strategies.flatMap(s => compare ? [['orig', s], ['edit', s]] : [['edit', s]]);
  const total = plan.length * runs;
  let done = 0, frame = 0;
  const bar = $('#run-bar'), count = $('#run-count'), go = $('#run-go'), stop = $('#run-stop');
  const paint = () => { frame = 0; bar.style.width = (done * 100 / total) + '%'; count.textContent = `${done} / ${total} партий`; };
  core.onProgress = () => { done++; if (!frame) frame = requestAnimationFrame(paint); };
  $('#run-progress').hidden = false; go.disabled = true; stop.disabled = false;
  S.results = { orig: {}, edit: {} };
  S.lastRun = { strategies, runs, seed, law, compare };
  renderResults();
  paint();
  const t0 = performance.now();
  try {
    for (const [which, s] of plan) {
      const loaded = await ensureLoaded(which);
      if (loaded?.errors?.length) throw new Error((which === 'orig' ? 'Исходные' : 'Правленые') + ' данные не загрузились, см. «Проверка»:\n' + loaded.errors.join('\n'));
      const t = performance.now();
      const out = await call('batch', { strategy: s, runs, seed, law });
      if (out.error) throw new Error(out.error);
      S.results[which][s] = { summary: parseSummary(out.text), events: out.events, ms: performance.now() - t, text: out.text };
      renderResults();
    }
    paint();
    count.textContent = `${total} партий за ${((performance.now() - t0) / 1000).toFixed(1)} с`;
  } catch (e) {
    paint();
    count.textContent = e.message === 'cancelled' ? `Отменено на ${done} из ${total}` : 'Прогон остановлен ошибкой';
    if (e.message !== 'cancelled') $('#run-out').prepend(h('pre', { class: 'issue' }, e.message));
  }
  core.onProgress = null;
  go.disabled = false; stop.disabled = true;
}
function eventTitles() {
  const out = {};
  for (const f of S.files.filter(f => f.startsWith('events/'))) {
    for (const e of S.ast[f]?.items || []) out[idOf(e)] = e.fields.find(x => x.key === 'title')?.val.v || '';
  }
  return out;
}
function renderResults() {
  const box = $('#run-out');
  if (!box) return;
  const R = S.results, run = S.lastRun;
  if (!run) { box.replaceChildren(h('p', { class: 'empty' }, 'Здесь появится сводка: квартили счёта и лет, причины падения, частоты событий, скрытые узлы и критерии калибровки 08b. С галочкой «Сравнить» каждая стратегия играется дважды: на опубликованных данных и на правленых.')); return; }
  const cols = run.compare ? ['orig', 'edit'] : ['edit'];
  const colName = { orig: 'До правок', edit: run.compare ? 'После' : 'Правленые данные' };
  const blocks = [];
  const q3 = v => v ? v.join(' / ') : '—';
  const titles = eventTitles(), ids = Object.keys(titles).sort();
  for (const s of run.strategies) {
    const got = cols.map(c => R[c][s]);
    if (!got.some(Boolean)) continue;
    const sm = got.map(g => g?.summary);
    const row = (name, f, num) => {
      const vals = sm.map(x => x ? f(x) : null);
      const cells = vals.map(v => h('td', { class: 'n' }, v ?? '—'));
      if (run.compare) {
        const d = num && vals[0] != null && vals[1] != null && vals[0] !== 0 ? Math.round((vals[1] / vals[0] - 1) * 100) : null;
        cells.push(h('td', { class: 'n' + (d > 0 ? ' up' : d < 0 ? ' down' : '') }, d == null ? '' : (d > 0 ? '+' : '') + d + '%'));
      }
      return h('tr', {}, h('td', {}, name), cells);
    };
    const falls = [...new Set(sm.flatMap(x => x ? Object.keys(x.falls) : []))];
    const nodes = [...new Set(sm.flatMap(x => x ? Object.keys(x.nodes) : []))];
    const rows = [
      row('Счёт, квартили 25 / 50 / 75', x => q3(x.score)), row('Счёт, медиана', x => x.score?.[1], true),
      row('Счёт за 150 лет, медиана', x => x.score150?.[1], true),
      row('Лет династии, квартили', x => q3(x.years)), row('Лет династии, медиана', x => x.years?.[1], true),
      row('Лет правления основателя, квартили', x => q3(x.reign)),
      row('Казна в конце, медиана', x => x.treasury?.[1], true), row('Армия в конце, медиана', x => x.army?.[1], true),
      row('Ранняя смерть, %', x => x.early, true), row('Дезертирство, % династий', x => x.deserted, true),
      row('Доля падений, %', x => x.fell, true),
      ...falls.map(f => row('Падение ' + f + ', %', x => x.falls[f] || 0, true)),
      ...nodes.map(nd => row('Скрытый узел ' + nd + ' при падении, медиана', x => x.nodes[nd]?.fall[1], true)),
    ];
    const ms = got.map(g => g ? (g.ms / 1000).toFixed(1) + ' с' : '…').join(' / ');
    blocks.push(h('h3', {}, `${s} · ${run.runs} партий с seed ${run.seed}${run.law ? ' · ' + run.law : ''} · ${ms}`),
      h('div', { class: 'tablewrap' }, h('table', {}, h('thead', {}, h('tr', {}, h('th', {}, ''), cols.map(c => h('th', {}, colName[c])), run.compare ? h('th', {}, 'Δ') : null)), h('tbody', {}, rows))));
    const ev = got.map(g => g?.events || {});
    const lastEv = ev[ev.length - 1];
    const erows = ids.map(id => h('tr', { class: got[got.length - 1] && !lastEv[id] ? 'zero' : '' }, h('td', { class: 'mono' }, id), h('td', {}, titles[id]),
      ev.map(e => h('td', { class: 'n' }, pct(e[id] || 0, run.runs) + '%'))));
    const never = got[got.length - 1] ? ids.filter(id => !lastEv[id]).length : '…';
    blocks.push(h('details', { class: 'more' }, h('summary', {}, `Частоты событий: доля партий, где событие случилось · ни разу: ${never}`),
      h('div', { class: 'tablewrap' }, h('table', {}, h('thead', {}, h('tr', {}, h('th', {}, 'id'), h('th', {}, 'Заголовок'), cols.map(c => h('th', {}, colName[c])))), h('tbody', {}, erows)))));
    blocks.push(h('details', { class: 'more' }, h('summary', {}, 'Сводка cli batch как есть'), cols.map(c => R[c][s] && h('pre', { class: 'out' }, colName[c] + '\n' + R[c][s].text.split('\n').filter(l => l.startsWith('#')).join('\n')))));
  }
  const crit = cols.map(c => criteria(R[c]));
  const chip = ok => ok == null ? h('span', { class: 'chip' }, 'нет данных') : h('span', { class: 'chip ' + (ok ? 'ok' : 'bad') }, ok ? '✓ выполнен' : '✗ не выполнен');
  const crows = crit[0].map((c, j) => h('tr', {}, h('td', {}, c.name), h('td', {}, c.need), crit.map(cr => h('td', {}, cr[j].val ?? '', ' ', chip(cr[j].ok)))));
  box.replaceChildren(
    h('h3', {}, 'Критерии калибровки 08b'),
    h('p', { class: 'note' }, 'Полные критерии требуют neutral, crown_all, vassal_all и warmonger: выберите «все стратегии» и 1000 партий, как в docs/calibration.md.'),
    h('div', { class: 'tablewrap' }, h('table', {}, h('thead', {}, h('tr', {}, h('th', {}, 'Критерий'), h('th', {}, 'Требование'), cols.map(c => h('th', {}, colName[c])))), h('tbody', {}, crows))),
    ...blocks);
}
