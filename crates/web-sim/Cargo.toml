[package]
name = "web-sim"
version.workspace = true
edition.workspace = true

# The core for the content editor (editor/): wasm-bindgen exports over `bd_core::batch`.
[lib]
name = "web_sim"
crate-type = ["cdylib", "rlib"]

[dependencies]
core = { path = "../core" }
serde_json = "1"
wasm-bindgen = "0.2"
